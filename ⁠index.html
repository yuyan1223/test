*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{background:var(--bg);font-family:'Noto Sans KR',-apple-system,sans-serif;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:1cm}
.cap{font-size:13px;color:var(--sub)}
.ph{position:relative;flex:none;background:#000;box-shadow:0 20px 50px #0003}
.scr{position:absolute;left:0;top:0;width:390px;height:851px;transform-origin:0 0;border-radius:50px;overflow:hidden;background:#000;font-size:15px;container-type:inline-size}
.ph.shake{animation:sh .09s infinite}
@keyframes sh{0%{transform:translate(calc(var(--v)*1px),0)}50%{transform:translate(calc(var(--v)*-1px),calc(var(--v)*.5px))}100%{transform:translate(calc(var(--v)*1px),0)}}
.lay{position:absolute;inset:0;display:none}.lay.on{display:block}
.isl{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:28%;height:26px;background:#000;border-radius:20px;z-index:50}
.sb{position:absolute;top:0;left:0;right:0;height:46px;display:flex;justify-content:space-between;align-items:center;padding:6px 7cqw 0;font-size:4cqw;font-weight:700;z-index:40;color:#fff}
.sb{--inv:#000}.sb.dk{color:#000;--inv:#fff}
.sr{display:flex;align-items:center;gap:.45em}.sr svg{height:.95em;width:auto;fill:currentColor}

const nowT=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function pushMsg(x,it,inc){it.t=nowT();x.items.push(it);x.ts=Date.now();haptic(7);if(S.cur&&S.cur.a==='msg'&&S.cur.t===x.id&&$('#ai .ch')){const ch=$('#ai .ch');ch.innerHTML=bubbles(x.items,false);ch.scrollTop=ch.scrollHeight}else if(inc)x.unread=(x.unread||0)+1}
async function autoRun(x){x.auto=1;S.auto=1;const stop=()=>!$('#mi')||S.cur.t!==x.id;await wait(700);
 for(const c of[...'我才起床呢，剛剛還沒醒呀']){if(stop()){x.auto=0;S.auto=0;KB.T=KB.Z='';return}KB.T+=c;kbUp();haptic(7);await wait(140)}
 await wait(600);if(stop()){x.auto=0;S.auto=0;KB.T=KB.Z='';return}sendMsg(1);await wait(1000);
 pushMsg(x,{who:'me',img:PIC1,m:'圖片'});await wait(2200);
 pushMsg(x,{who:'Jane',m:'今日份早安'},1);await wait(1300);
 pushMsg(x,{who:'Jane',img:PIC2,m:'圖片'},1);S.auto=0}
function goHome(){icons();show('home')}
$('#hb').onclick=()=>{if(S.scr==='app'||S.scr==='home')goHome()};
let sy=null;$('#scr').addEventListener('pointerdown',e=>{const r=$('#scr').getBoundingClientRect();sy=(e.clientY-r.top)>r.height*.93?e.clientY:null});
addEventListener('pointerup',e=>{if(sy!==null&&sy-e.clientY>25&&(S.scr==='app'||S.scr==='home'))goHome();sy=null});
/* wake / boot / lock */
$('#off').onclick=async()=>{show('boot');$('#bn').textContent=DATA.owner;await wait(2000);lockScreen()};
let stackN=0;
function settle(){const nl=$('#nl');for(let g=0;g<8;g++){const cs=$$('#nl .nc:not(.out)');const h=cs.reduce((a,c)=>a+Math.max(c.offsetHeight,c.scrollHeight)+8.6,0);if(cs.length>1&&h+40>nl.clientHeight)pack(cs.length-1);else break}anchor()}
function anchor(){const nl=$('#nl');if(!stackN){nl.style.paddingTop='0px';return}const cs=$$('#nl .nc:not(.out)');const h=cs.reduce((a,c)=>a+Math.max(c.offsetHeight,c.scrollHeight)+8.6,0)+(stackN>1?35:23.4);nl.style.paddingTop=Math.max(0,nl.clientHeight-h)+'px'}
function haptic(i,p){try{navigator.vibrate&&navigator.vibrate(p||Math.max(12,50-i*6))}catch(e){}try{$('#hl').click()}catch(e){}}
function fit(){const ph=$('#ph'),sc=$('#scr'),m=innerWidth<600?16:38;const ex=$('.cap').offsetHeight+$('#pwr').offsetHeight+24;
 let H=innerHeight-2*m-ex,W=H*5.5/12;if(W>innerWidth-2*m){W=innerWidth-2*m;H=W*12/5.5}
 const b=W*.024,k=(W-2*b)/390;ph.style.width=W+'px';ph.style.height=H+'px';ph.style.borderRadius=W*.115+'px';
 sc.style.left=sc.style.top=b+'px';sc.style.transform=`scale(${k})`;sc.style.height=(H-2*b)/k+'px'}
function exitKb(){const ph=$('#ph'),sc=$('#scr');document.body.classList.remove('kbd');ph.style.cssText='';sc.style.borderRadius='';fit()}
function fitKb(){const v=window.visualViewport,ph=$('#ph'),sc=$('#scr'),W=v.width,H=v.height,k=W/390;document.body.classList.add('kbd');ph.style.cssText=`position:fixed;left:${v.offsetLeft}px;top:${v.offsetTop}px;width:${W}px;height:${H}px;border-radius:0;z-index:99`;sc.style.left=sc.style.top='0px';sc.style.transform=`scale(${k})`;sc.style.height=H/k+'px';sc.style.borderRadius='0';const ch=$('#ai .ch');if(ch)ch.scrollTop=ch.scrollHeight}
function kbEval(){const v=window.visualViewport;if(!v||!matchMedia('(pointer:coarse)').matches)return;const on=document.activeElement&&document.activeElement.id==='mi'&&v.height<screen.height*.7;if(on)fitKb();else if(document.body.classList.contains('kbd'))exitKb()}
addEventListener('resize',()=>{document.body.classList.contains('kbd')?kbEval():fit()});
if(window.visualViewport){visualViewport.addEventListener('resize',kbEval);visualViewport.addEventListener('scroll',()=>{if(document.body.classList.contains('kbd'))kbEval()})}
document.addEventListener('focusin',()=>setTimeout(kbEval,350));document.addEventListener('focusout',()=>setTimeout(kbEval,120));
$('#ai').addEventListener('mousedown',e=>{if(e.target.closest('[data-send]'))e.preventDefault()});
fit();
function pack(idx){const cs=$$('#nl .nc:not(.out)');if(cs.length<=idx)return;const c=cs[idx];c.classList.add('out');stackN++;$('#stk').className='stk on'+Math.min(stackN,2);setTimeout(()=>c.remove(),600)}
async function lockScreen(){show('lock');const nl=$('#nl');nl.innerHTML='<div class="stk" id="stk"><i></i><i></i></div>';$('#sum').className='';stackN=0;
 if(S.woke){DATA.notifs.filter(n=>n.name==='Jane').forEach(n=>nl.insertAdjacentHTML('afterbegin',card(n)));stackN=2;$('#stk').className='stk on2';anchor();return}
 S.busy=true;const w=[600,700,850,1000,1200,1450,1750];
 for(let i=0;i<DATA.notifs.length;i++){haptic(7);nl.insertAdjacentHTML('afterbegin',card(DATA.notifs[i]));settle();await wait(w[i]+500)}
 await wait(700);
 const s=$('#sum');s.innerHTML=`<div>${stackN?`查看更多 ${stackN} 則通知<br>`:''}點擊以解鎖</div>`;s.classList.add('on');S.busy=false;S.woke=true}
const card=n=>`<div class="nc"><div class="ni" style="${n.img&&n.img!=='cal'?`background-image:var(--i-${n.img})`:`background:${n.c||'none'}`}">${n.img==='cal'?calHTML():(n.img?'':n.ic)}</div><div class="tx"><b>${n.name}</b><span class="x">${n.text}</span></div><span class="t2">${n.t}</span></div>`;
/* passcode */
const LT={2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'};
$('#kp').innerHTML=[1,2,3,4,5,6,7,8,9,0].map(n=>`<button data-k="${n}" ${n===0?'class=z':''}><b>${n}</b>${LT[n]?`<small>${LT[n]}</small>`:''}</button>`).join('');
$('#cnl').onclick=()=>{$('#pw').classList.remove('on');S.pin='';$('#pm').textContent=''};
$('#emg').onclick=()=>toast('緊急服務（示範版不提供）');
$('#lock').onclick=e=>{if(S.busy||e.target.closest('#pw'))return;$('#pw').classList.add('on');S.pin='';dots()};
function dots(){$$('#dots i').forEach((d,i)=>d.classList.toggle('f',i<S.pin.length))}
async function key(k){if(!$('#pw').classList.contains('on')||S.busy)return;if(S.pin.length>=4)return;S.pin+=k;dots();haptic(7);
 if(S.pin.length===4){S.busy=true;await wait(200);if(S.pin===DATA.pin){$('#pw').classList.remove('on');S.pin='';S.fails=0;$('#pm').textContent='';goHome()}
  else{S.fails++;const d=$('#dots');d.classList.add('bad');haptic(0,[45,60,45,60,45]);setTimeout(()=>haptic(0),110);$('#pm').textContent=S.fails>=4?'提示：'+DATA.hint:'密碼錯誤';await wait(420);d.classList.remove('bad');S.pin='';dots()}S.busy=false}}
$('#kp').onclick=e=>{const b=e.target.closest('[data-k]');if(b)key(b.dataset.k)};
document.addEventListener('keydown',e=>{if(/^\d$/.test(e.key))key(e.key)});
$('#pwr').onclick=()=>{$('#pw').classList.remove('on');show('off')};
</script></body></html>
